[package]
name = "wmx"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Persistent Windows ConPTY sessions with the zmx contract used by Ghostex"
repository = "https://github.com/maddada/wmx"

[dependencies]
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
crossterm = "0.28"
portable-pty = "0.9"
rand = "0.8"
subtle = "2"
vt100 = { version = "=0.16.2", path = "vendor/vt100" }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Console", "Win32_System_Threading", "Win32_Security", "Win32_System_WindowsProgramming"] }
